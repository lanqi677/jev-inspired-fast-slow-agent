<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>贪吃蛇 · 快决策测试台</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;color:#d7dee8;
    font:14px/1.5 "Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif}
  #wrap{display:flex;gap:22px;align-items:flex-start;padding:22px}
  canvas{background:#141922;border:1px solid #263042;border-radius:8px;display:block}
  #hud{min-width:260px}
  h1{font-size:16px;margin:0 0 12px;color:#8fb6ff;font-weight:600}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1d2430}
  .k{color:#7c8ba1}
  .v{color:#e8eef7;font-variant-numeric:tabular-nums}
  #log{margin-top:12px;font:12px/1.6 ui-monospace,monospace;color:#8b9bb0;max-height:260px;overflow:auto}
  #log b{color:#5fd38d}
  #log i{color:#e06c75;font-style:normal}
  .over{color:#e06c75}
  code{background:#1a2130;padding:1px 5px;border-radius:3px;color:#9fc4ff}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="420" height="420"></canvas>
  <div id="hud">
    <h1>贪吃蛇 · 快决策测试台</h1>
    <div class="row"><span class="k">得分</span><span class="v" id="s-score">0</span></div>
    <div class="row"><span class="k">蛇长</span><span class="v" id="s-len">3</span></div>
    <div class="row"><span class="k">步数</span><span class="v" id="s-steps">0</span></div>
    <div class="row"><span class="k">朝向</span><span class="v" id="s-dir">右</span></div>
    <div class="row"><span class="k">状态</span><span class="v" id="s-state">进行中</span></div>
    <div class="row"><span class="k">随机种子</span><span class="v" id="s-seed">-</span></div>
    <div id="log"></div>
  </div>
</div>
<script>
/* ============================================================================
 * 贪吃蛇 —— 供「快决策闭环」测试用
 *
 * 设计要点：
 *  1) 【不吃自动 tick】。整局由外部一步一条指令驱动 (window.SNAKE.move(key))。
 *     这样快决策模型的每次调用都不受时间压力，整局也完全可复现。
 *  2) 食物位置【随机】(可传 seed 复现)。这正是要考的：随机元素意味着
 *     任何"写死的操作序列"必然失效，只能靠"看当前状态再决定"。
 *  3) 对外只暴露三样东西，正好对应适配器四件套：
 *        stateText()  ① 状态编码   盘面压成文字
 *        options()    ② 可选项     上/下/左/右（反向被游戏规则禁用）
 *        move(key)    ③ 动作执行
 *        over/reason  ④ 终止判定
 * ==========================================================================*/
(() => {
  const N = 10;                       // 盘面 N×N
  const CELL = 42;
  const DIRCN = { U: '上', D: '下', L: '左', R: '右' };
  const DELTA = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
  const OPP   = { U: 'D', D: 'U', L: 'R', R: 'L' };
  const KEY2DIR = { ArrowUp:'U', ArrowDown:'D', ArrowLeft:'L', ArrowRight:'R', U:'U', D:'D', L:'L', R:'R' };
  const DIR2KEY = { U:'ArrowUp', D:'ArrowDown', L:'ArrowLeft', R:'ArrowRight' };

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let rng, snake, dir, food, score, over, reason, steps, seed;

  const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296 };

  function placeFood() {
    const free = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (!snake.some(s => s[0] === r && s[1] === c)) free.push([r, c]);
    if (!free.length) return null;
    return free[Math.floor(rng() * free.length)];
  }

  function reset(s) {
    const q = new URLSearchParams(location.search);
    seed = (s === undefined || s === null || s === '') ? (q.get('seed') !== null ? Number(q.get('seed')) : (Date.now() % 100000)) : Number(s);
    rng = mulberry32(seed);
    const mid = Math.floor(N / 2);
    snake = [[mid, 3], [mid, 2], [mid, 1]];   // 蛇头在前
    dir = 'R'; score = 0; over = false; reason = ''; steps = 0;
    food = placeFood();
    document.getElementById('log').innerHTML = '';
    draw(); hud();
    return { ok: true, seed };
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#161c26' : '#141922';
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
    if (food) {
      ctx.fillStyle = '#e8b04b';
      ctx.beginPath();
      ctx.arc(food[1] * CELL + CELL / 2, food[0] * CELL + CELL / 2, CELL * 0.28, 0, 7);
      ctx.fill();
    }
    snake.forEach(([r, c], i) => {
      ctx.fillStyle = i === 0 ? '#7fe0a8' : (over ? '#6b4048' : '#3f9e6a');
      ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    });
    ctx.strokeStyle = '#263042';
    for (let i = 0; i <= N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, N * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(N * CELL, i * CELL); ctx.stroke();
    }
  }

  function hud() {
    const g = id => document.getElementById(id);
    g('s-score').textContent = score; g('s-len').textContent = snake.length;
    g('s-steps').textContent = steps; g('s-dir').textContent = DIRCN[dir];
    g('s-seed').textContent = seed;
    const st = g('s-state');
    st.textContent = over ? ('已结束：' + reason) : '进行中';
    st.className = 'v' + (over ? ' over' : '');
  }
  function log(html) { const l = document.getElementById('log'); l.insertAdjacentHTML('afterbegin', html + '<br>'); }

  /* ---- ③ 动作执行：走一步。反向是游戏规则禁止的，不推进。---- */
  function move(key) {
    if (over) return { ok: false, reason: '游戏已结束' };
    const nd = KEY2DIR[key];
    if (!nd) return { ok: false, reason: '未知按键 ' + key };
    if (nd === OPP[dir]) { log('<i>✗ 反向 ' + DIRCN[nd] + ' 被拒</i>'); return { ok: false, reason: '不能反向 ' + DIRCN[nd] }; }

    dir = nd; steps++;
    const [hr, hc] = snake[0];
    const nr = hr + DELTA[nd][0], nc = hc + DELTA[nd][1];

    if (nr < 0 || nr >= N || nc < 0 || nc >= N) { over = true; reason = '撞墙'; draw(); hud(); log('<i>✗ 撞墙，第 ' + steps + ' 步</i>'); return { ok: true, over: true, reason, score } }
    // 尾巴这一步会让开，所以撞尾巴不算死
    if (snake.some((s, i) => i < snake.length - 1 && s[0] === nr && s[1] === nc)) { over = true; reason = '撞到自己'; draw(); hud(); log('<i>✗ 撞到自己，第 ' + steps + ' 步</i>'); return { ok: true, over: true, reason, score } }

    const ate = !!food && food[0] === nr && food[1] === nc;
    snake.unshift([nr, nc]);
    if (ate) {
      score++;
      food = placeFood();
      log('<b>✓ 吃到！得分 ' + score + '（第 ' + steps + ' 步）</b>');
      if (!food) { over = true; reason = '通关：盘面填满'; }
    } else snake.pop();

    draw(); hud();
    return { ok: true, ate, score, over, reason, len: snake.length };
  }

  /* ---- ① 状态编码：盘面 → 紧凑文字。模型只能看到这段。---- */
  function stateText() {
    const g = Array.from({ length: N }, () => Array(N).fill('.'));
    snake.forEach(([r, c], i) => { g[r][c] = i === 0 ? 'H' : '#' });
    if (food) g[food[0]][food[1]] = 'F';
    const L = [`盘面 ${N}x${N}（第0行在最上面，第0列在最左）  蛇长 ${snake.length}  得分 ${score}  已走 ${steps} 步  ${over ? '已结束：' + reason : '进行中'}`];
    g.forEach((row, i) => L.push(String(i).padStart(2) + ' ' + row.join(' ')));
    L.push(`图例  H=蛇头  #=蛇身  F=食物  .=空`);
    L.push(`蛇头在第 ${snake[0][0]} 行第 ${snake[0][1]} 列，当前朝 ${DIRCN[dir]}`);
    L.push(food ? `食物在第 ${food[0]} 行第 ${food[1]} 列` : '食物：无（盘面已满）');
    return L.join('\n');
  }

  /* ---- ② 可选项：上/下/左/右。反向被游戏规则禁用。---- */
  function options() {
    return ['U', 'D', 'L', 'R'].map(d => ({
      id: d,
      label: DIRCN[d] + (d === OPP[dir] ? '（反向·非法）' : ''),
      act: { do: 'press', key: DIR2KEY[d], dir: d },
      enabled: !over && d !== OPP[dir],
    }));
  }

  // 键盘也能玩（人肉对照用）
  addEventListener('keydown', e => { const d = KEY2DIR[e.key]; if (d) { e.preventDefault(); move(e.key) } });

  reset();
  window.SNAKE = {
    move, stateText, options, reset,
    get over() { return over }, get score() { return score }, get reason() { return reason },
    get seed() { return seed }, get steps() { return steps }, get dir() { return dir },
    get snake() { return snake.map(s => s.slice()) }, get food() { return food ? food.slice() : null },
    N,
  };
})();
</script>
</body>
</html>
